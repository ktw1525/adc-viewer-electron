<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>USB CDC 오실로스코프</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    :root {
      --bg: #0f1116;
      --panel: #151926;
      --fg: #e6e9ef;
      --muted: #a0a6b3;
      --accent: #6aa4ff;
      --accent2: #9f6aff;
      --good: #49d17d;
      --warn: #ffb74d;
      --danger: #ff6e6e;
      --grid: #2a2f3e;
    }
    * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', 'Apple SD Gothic Neo', Arial, Helvetica, sans-serif; }
    body { margin:0; background: var(--bg); color: var(--fg); }
    header { padding: 10px 16px; background: #0b0d13; border-bottom: 1px solid #1c2132; display:flex; align-items:center; gap:12px; }
    header h1 { font-size: 16px; margin: 0 10px 0 0; color: #c9d1e1; }
    .row { display:flex; gap:12px; align-items: center; flex-wrap: wrap; }
    select, input[type="number"], input[type="text"] { background: #0f1320; color: var(--fg); border:1px solid #22293c; border-radius: 8px; padding:6px 8px; }
    button { background: var(--accent); border:none; border-radius: 10px; padding:8px 12px; color:#08101e; font-weight:600; cursor:pointer; }
    button.secondary { background: #223153; color:#cbd5f1;}
    button.danger { background: var(--danger); color:#1c0404;}
    button:disabled { opacity: .5; cursor: not-allowed; }
    main { display:grid; grid-template-columns: 340px 1fr; height: calc(100vh - 54px); }
    aside { background: var(--panel); border-right:1px solid #1c2132; overflow:auto; padding:14px; }
    section { padding: 10px; }
    .group { border:1px solid #21283b; border-radius: 12px; padding:10px; margin-bottom: 10px; }
    .group h3 { margin: 0 0 10px 0; font-size: 13px; color:#b5c0d9; }
    .group label { font-size: 12px; color: var(--muted); display:block; margin:6px 0 2px; }
    input[type="range"] { width: 100%; }
    canvas { background: #0a0c12; width: 100%; height: 100%; display:block; }
    #status { font-size:12px; color: var(--muted); padding:2px 0 0 2px;}
    .kbd { padding:2px 6px; background:#0f1424; border:1px solid #243153; border-radius:6px; color:#bcd; font-size:11px;}
    .legend { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    .legend .tag { border-radius: 8px; padding:2px 8px; font-size:11px; background:#0f1424; border:1px solid #243153; }
    .hl { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 8px; }
  </style>
</head>
<body>
<header>
  <h1>USB CDC 오실로스코프</h1>
  <div class="row">
    <select id="portList"></select>
    <select id="baud">
      <option value="921600">921600</option>
      <option value="2000000">2000000</option>
      <option value="115200">115200</option>
    </select>
    <button id="btnRefresh" class="secondary">포트 새로고침</button>
    <button id="btnConnect">연결</button>
    <button id="btnDisconnect" class="danger" disabled>해제</button>
    <span id="status">대기</span>
  </div>
</header>
<main>
  <aside>
    <section class="group">
      <h3>트리거</h3>
      <label>모드</label>
      <div class="row">
        <label><input type="radio" name="trigMode" value="auto" checked> Auto</label>
        <label><input type="radio" name="trigMode" value="normal"> Normal</label>
        <label><input type="radio" name="trigMode" value="single"> Single</label>
        <button id="btnArm" class="secondary">Single ARM/Reset</button>
      </div>

      <label>소스 채널</label>
      <select id="trigSource">
        <option value="0">CH1</option>
        <option value="1">CH2</option>
        <option value="2">CH3</option>
        <option value="3">CH4</option>
      </select>

      <label>엣지</label>
      <div class="row">
        <label><input type="radio" name="trigEdge" value="rising" checked> Rising</label>
        <label><input type="radio" name="trigEdge" value="falling"> Falling</label>
      </div>

      <label>레벨 (<span id="trigLevelVal">0</span>)</label>
      <input id="trigLevel" type="range" min="-4096" max="4096" value="0" step="1">

      <label>트리거 위치 (% 화면 가로)</label>
      <input id="trigPos" type="range" min="5" max="95" value="25">
    </section>

    <section class="group">
      <h3>표시/시간축</h3>
      <label>표시 샘플 길이 (프레임 합성) <span id="dispLenVal" class="kbd">300</span></label>
      <input id="dispLen" type="range" min="300" max="6000" step="300" value="300">
      <div class="legend">
        <span class="tag">프레임=300</span>
        <span class="tag">프레임/초=60</span>
        <span class="tag">샘플/초=18k</span>
      </div>

      <label>세로 스케일 (배율) <span id="vScaleVal" class="kbd">1.0x</span></label>
      <input id="vScale" type="range" min="0.2" max="8" step="0.1" value="1.0">
    </section>

    <section class="group">
      <h3>채널 오프셋 (px)</h3>
      <label>CH1: <span id="off1Val" class="kbd">-120</span></label>
      <input id="off1" type="range" min="-300" max="300" step="1" value="-120">
      <label>CH2: <span id="off2Val" class="kbd">-40</span></label>
      <input id="off2" type="range" min="-300" max="300" step="1" value="-40">
      <label>CH3: <span id="off3Val" class="kbd">40</span></label>
      <input id="off3" type="range" min="-300" max="300" step="1" value="40">
      <label>CH4: <span id="off4Val" class="kbd">120</span></label>
      <input id="off4" type="range" min="-300" max="300" step="1" value="120">
    </section>

    <section class="group">
      <h3>도움말</h3>
      <p style="font-size:12px; color:var(--muted); line-height:1.5">
        • 프레임 종단은 0xFFFF,0xFFFF (4B) 마커로 판별.<br>
        • 표시 샘플 길이가 300을 넘으면 프레임을 합쳐 연속 구간을 렌더링.<br>
        • Normal/Single 모드에서는 유효 트리거가 잡히기 전까지 화면 홀드.<br>
        • Auto 모드는 트리거 불발 시에도 최신 데이터로 계속 스크롤.<br>
        • 트리거 수평선은 트리거 소스 채널 기준으로 그려짐.
      </p>
    </section>
  </aside>

  <section>
    <canvas id="scope"></canvas>
  </section>
</main>

<script src="renderer.js"></script>
</body>
</html>
