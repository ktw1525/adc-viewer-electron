<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>ADC Viewer (Diff 4ch)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://unpkg.com">
  <script src="https://unpkg.com/dygraphs@2.2.1/dist/dygraph.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/dygraphs@2.2.1/dist/dygraph.min.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
    select, input, button { padding: 6px 8px; }
    #g { width: 100%; height: 520px; }
  </style>
</head>
<body>
  <h2>ADC 실시간 파형 (차분 4채널 · 최신 프레임만)</h2>

  <div class="row">
    <button id="refresh">포트 새로고침</button>
    <select id="ports"></select>
    <label>Baud: <input id="baud" type="number" value="115200" step="1200" style="width:100px"></label>
    <button id="open">열기</button>
    <button id="close" disabled>닫기</button>
    <span id="stat"></span>
  </div>

  <div class="row">
    <label><input type="checkbox" class="ch" data-idx="1" checked> CH(0-1)</label>
    <label><input type="checkbox" class="ch" data-idx="2" checked> CH(2-3)</label>
    <label><input type="checkbox" class="ch" data-idx="3" checked> CH(4-5)</label>
    <label><input type="checkbox" class="ch" data-idx="4" checked> CH(6-7)</label>
  </div>

  <div id="g"></div>

  <script>
    const portsSel = document.getElementById('ports');
    const refreshBtn = document.getElementById('refresh');
    const openBtn = document.getElementById('open');
    const closeBtn = document.getElementById('close');
    const baudInput = document.getElementById('baud');
    const stat = document.getElementById('stat');

    const labels = ['x', 'CH(0-1)', 'CH(2-3)', 'CH(4-5)', 'CH(6-7)'];
    const g = new Dygraph(
      document.getElementById('g'),
      [],
      {
        labels,
        xlabel: 'Sample Index',
        ylabel: 'Counts (diff)',
        legend: 'always',
        strokeWidth: 1.2,
        drawPoints: false,
        connectSeparatedPoints: true,
        animatedZooms: true
      }
    );

    function updateVisibility() {
      document.querySelectorAll('.ch').forEach(cb => {
        const idx = Number(cb.dataset.idx) - 1; // x 제외
        g.setVisibility(idx, cb.checked);
      });
    }
    document.querySelectorAll('.ch').forEach(cb => cb.addEventListener('change', updateVisibility));
    updateVisibility();

    async function refreshPorts() {
      portsSel.innerHTML = '';
      const list = await window.adc.listPorts();
      if (!list.length) {
        portsSel.innerHTML = '<option value="">(포트 없음)</option>';
        return;
      }
      list.forEach(p => {
        const o = document.createElement('option');
        o.value = p.path;
        o.textContent = p.friendlyName ? `${p.path} - ${p.friendlyName}` : p.path;
        portsSel.appendChild(o);
      });
    }

    refreshBtn.onclick = refreshPorts;
    refreshPorts();

    openBtn.onclick = async () => {
      const path = portsSel.value;
      const baudRate = Number(baudInput.value) || 115200;
      if (!path) { alert('포트를 선택하세요'); return; }
      try {
        stat.textContent = '열기...';
        await window.adc.openPort({ path, baudRate });
        stat.textContent = `열림: ${path} @ ${baudRate}`;
        openBtn.disabled = true;
        closeBtn.disabled = false;
      } catch (e) {
        stat.textContent = `오류: ${e}`;
        console.error(e);
      }
    };

    closeBtn.onclick = async () => {
      await window.adc.closePort();
      stat.textContent = '닫힘';
      openBtn.disabled = false;
      closeBtn.disabled = true;
      g.updateOptions({ file: [] }); // 화면 비우기
    };

    // 최신 프레임만 표시: 이전 데이터는 누적하지 않음
    window.adc.onFrame((rows) => {
      g.updateOptions({ file: rows });
      // 필요하면 축 리셋: g.resetZoom();
    });
  </script>
</body>
</html>
